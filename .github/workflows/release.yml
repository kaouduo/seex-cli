name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset_suffix }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-x86_64
            binary: seex.exe
            archive: zip
          - os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            asset_suffix: windows-aarch64
            binary: seex.exe
            archive: zip
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64
            binary: seex
            archive: tar.gz
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            asset_suffix: linux-aarch64
            binary: seex
            archive: tar.gz
          - os: macos-26-intel
            target: x86_64-apple-darwin
            asset_suffix: macos-x86_64
            binary: seex
            archive: tar.gz
          - os: macos-26
            target: aarch64-apple-darwin
            asset_suffix: macos-aarch64
            binary: seex
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libx11-dev \
            libxi-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libudev-dev

      - name: Install Windows installer tools
        if: runner.os == 'Windows' && matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Run tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin seex

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag.TrimStart("v")
          $name = "seex-$tag-${{ matrix.asset_suffix }}"
          $bin = "target\${{ matrix.target }}\release\${{ matrix.binary }}"
          $assets = New-Object System.Collections.Generic.List[string]

          $rawExe = "$name.exe"
          Copy-Item $bin $rawExe -Force
          $assets.Add($rawExe)

          New-Item -ItemType Directory -Path "dist\$name" -Force
          Copy-Item $bin "dist\$name\"
          $archive = "$name.${{ matrix.archive }}"
          Compress-Archive -Path "dist\$name\*" -DestinationPath $archive -Force
          $assets.Add($archive)

          if ("${{ matrix.target }}" -eq "x86_64-pc-windows-msvc") {
            $setupBase = "$name-setup"
            $setupExe = "$setupBase.exe"
            $iss = "$setupBase.iss"
            $issContent = @(
              '[Setup]'
              'AppId={{A5AE338A-F870-4DB2-98A1-03C7B012A699}'
              'AppName=SeEx'
              'AppVersion=' + $version
              'AppVerName=SeEx ' + $version
              'AppPublisher=Ref42'
              'AppPublisherURL=https://github.com/ref42/seex'
              'AppSupportURL=https://github.com/ref42/seex'
              'AppUpdatesURL=https://github.com/ref42/seex/releases'
              'ArchitecturesAllowed=x64'
              'ArchitecturesInstallIn64BitMode=x64'
              'DefaultDirName={autopf}\SeEx'
              'DefaultGroupName=SeEx'
              'DisableProgramGroupPage=yes'
              'OutputDir=.'
              'OutputBaseFilename=' + $setupBase
              'SetupIconFile=assets\icons\seex.ico'
              'UninstallDisplayName=SeEx ' + $version
              'Compression=lzma'
              'SolidCompression=yes'
              'UninstallDisplayIcon={app}\seex.exe'
              ''
              '[Files]'
              'Source: "' + $bin + '"; DestDir: "{app}"; Flags: ignoreversion'
              ''
              '[Icons]'
              'Name: "{group}\SeEx"; Filename: "{app}\seex.exe"'
              'Name: "{autodesktop}\SeEx"; Filename: "{app}\seex.exe"; Tasks: desktopicon'
              ''
              '[Tasks]'
              'Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"; Flags: unchecked'
              ''
              '[Run]'
              'Filename: "{app}\seex.exe"; Description: "Launch SeEx"; Flags: nowait postinstall skipifsilent'
            )
            $issContent | Set-Content -Path $iss -Encoding UTF8

            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) {
              $isccCommand = Get-Command ISCC.exe -ErrorAction SilentlyContinue
              if (-not $isccCommand) {
                throw "Inno Setup was installed, but ISCC.exe was not found."
              }
              $iscc = $isccCommand.Source
            }
            & $iscc $iss
            $assets.Add($setupExe)
          }

          "ASSETS<<EOF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          foreach ($asset in $assets) {
            $asset | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "EOF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          name="seex-$tag-${{ matrix.asset_suffix }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$name/"
          asset="$name.${{ matrix.archive }}"
          tar -czf "$asset" -C dist "$name"
          echo "ASSETS=$asset" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: seex-${{ env.RELEASE_TAG }}-${{ matrix.asset_suffix }}
          path: ${{ env.ASSETS }}

  build-linux-distro:
    name: build ${{ matrix.asset_suffix }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            container: fedora:latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: fedora-x86_64
            install: dnf install -y git ca-certificates rust cargo gcc gcc-c++ make pkgconf-pkg-config openssl-devel libX11-devel libXi-devel libxcb-devel libXcursor-devel libXrandr-devel libXinerama-devel libxkbcommon-devel libxkbcommon-x11-devel wayland-devel mesa-libGL-devel mesa-libEGL-devel gtk3-devel dbus-devel systemd-devel
          - os: ubuntu-26.04-arm
            container: fedora:latest
            target: aarch64-unknown-linux-gnu
            asset_suffix: fedora-aarch64
            install: dnf install -y git ca-certificates rust cargo gcc gcc-c++ make pkgconf-pkg-config openssl-devel libX11-devel libXi-devel libxcb-devel libXcursor-devel libXrandr-devel libXinerama-devel libxkbcommon-devel libxkbcommon-x11-devel wayland-devel mesa-libGL-devel mesa-libEGL-devel gtk3-devel dbus-devel systemd-devel
          - os: ubuntu-26.04
            container: archlinux:latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: arch-x86_64
            install: (grep -q "^DisableSandbox" /etc/pacman.conf || sed -i "/^\[options\]$/a DisableSandbox" /etc/pacman.conf) && pacman -Syu --noconfirm --needed git ca-certificates base-devel rust cargo pkgconf openssl libx11 libxi libxcb libxcursor libxrandr libxinerama libxkbcommon libxkbcommon-x11 wayland mesa gtk3 dbus systemd-libs
          - os: ubuntu-26.04-arm
            container: menci/archlinuxarm:base-devel
            target: aarch64-unknown-linux-gnu
            asset_suffix: arch-aarch64
            install: (grep -q "^DisableSandbox" /etc/pacman.conf || sed -i "/^\[options\]$/a DisableSandbox" /etc/pacman.conf) && pacman-key --init && pacman-key --populate archlinuxarm && pacman -Syu --noconfirm --needed git ca-certificates rust cargo pkgconf openssl libx11 libxi libxcb libxcursor libxrandr libxinerama libxkbcommon libxkbcommon-x11 wayland mesa gtk3 dbus systemd-libs

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Build in distro container
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          asset_suffix="${{ matrix.asset_suffix }}"
          target="${{ matrix.target }}"
          container="${{ matrix.container }}"
          name="seex-$tag-$asset_suffix"
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e CARGO_TARGET_DIR="target/$asset_suffix" \
            -e RELEASE_TAG="$tag" \
            -e ASSET_SUFFIX="$asset_suffix" \
            -e PACKAGE_NAME="$name" \
            -e TARGET="$target" \
            "$container" \
            bash -lc '${{ matrix.install }} && cargo test --locked --target "$TARGET" && cargo build --release --locked --target "$TARGET" --bin seex && mkdir -p "dist/$ASSET_SUFFIX/$PACKAGE_NAME" && cp "target/$ASSET_SUFFIX/$TARGET/release/seex" "dist/$ASSET_SUFFIX/$PACKAGE_NAME/"'
          tar -czf "$name.tar.gz" -C "dist/$asset_suffix" "$name"
          echo "ASSETS=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: seex-${{ env.RELEASE_TAG }}-${{ matrix.asset_suffix }}
          path: ${{ env.ASSETS }}

  release:
    name: publish release assets
    runs-on: ubuntu-latest
    needs:
      - build
      - build-linux-distro
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          generate_release_notes: true
