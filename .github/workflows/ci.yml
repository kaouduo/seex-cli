name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI may read the repository, but it cannot approve, merge, push, or modify PRs.
permissions:
  contents: read

jobs:
  quality:
    name: Format, check, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libx11-dev libxi-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev \
            libegl1-mesa-dev libgtk-3-dev libdbus-1-dev libudev-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --locked

      - name: Run Clippy correctness checks
        run: cargo clippy --locked --all-targets --all-features -- -D clippy::correctness -D clippy::suspicious

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libx11-dev libxi-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev \
            libegl1-mesa-dev libgtk-3-dev libdbus-1-dev libudev-dev

      - name: Build release binary
        run: cargo build --release --locked --features gui --bin seex --bin seex-cli

  linux-distros:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora
            image: fedora:latest
            install: >-
              dnf install -y git ca-certificates rust cargo gcc gcc-c++ make
              pkgconf-pkg-config openssl-devel libX11-devel libXi-devel libxcb-devel
              libXcursor-devel libXrandr-devel libXinerama-devel libxkbcommon-devel
              libxkbcommon-x11-devel wayland-devel mesa-libGL-devel mesa-libEGL-devel
              gtk3-devel dbus-devel systemd-devel
          - name: Arch Linux
            image: archlinux:latest
            install: >-
              sed -i "/^DisableSandbox/d; /^\[options\]/a DisableSandbox"
              /etc/pacman.conf && pacman -Syu --noconfirm --needed git ca-certificates
              base-devel rust cargo pkgconf openssl libx11 libxi libxcb libxcursor
              libxrandr libxinerama libxkbcommon libxkbcommon-x11 wayland mesa gtk3
              dbus systemd-libs

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build and test in distro container
        env:
          INSTALL_COMMAND: ${{ matrix.install }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e INSTALL_COMMAND \
            "${{ matrix.image }}" \
            bash -lc 'eval "$INSTALL_COMMAND" && cargo test --locked && cargo build --release --locked --features gui --bin seex'
